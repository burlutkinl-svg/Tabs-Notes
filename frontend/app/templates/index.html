<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab-Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1>Tab-Notes</h1>
        <!-- Форма загрузки -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Загрузить фотографии</h5>
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="photoInput" class="form-label">Выберите фотографии</label>
                        <input class="form-control" type="file" id="photoInput" multiple accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary">Загрузить</button>
                </form>
                <div id="uploadResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="d-flex gap-2 mb-4">
            <button id="historyButton" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#historyModal">История</button>
            <button id="formatToggle" class="btn btn-outline-primary">Табы -> Ноты</button>
        </div>
    </div>

    <!-- Модальное окно истории -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="historyModalLabel">История пакетов</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="historyContent">
                        <p>Загрузка...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
